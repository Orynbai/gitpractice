name: First CI

on:
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Print message
        run: echo "Github Actions is working!"

      - name: Show OS
        run: uname -a 

      - name: Show files
        run: ls -la

      - name: Show workspace
        run: echo "$GITHUB_WORKSPACE"

      - name: Show current directory
        run: pwd             