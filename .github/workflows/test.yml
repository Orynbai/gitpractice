name: Task CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check Readme
      run: |
        if [ -f "README.md" ]; then
          echo "File exist"
          if [ -s "README.md" ]; then
            echo "All checks passed"
            exit 0
          else
            echo "Checks dodesn't passed"
            exit 1
          fi  
        else
          echo "file doesn't exist"
          exit 1      
        fi
        
    - name: Next step
      run: echo "Next step started"      