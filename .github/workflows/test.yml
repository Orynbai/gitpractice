name: Task CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu_latest
    steps:
    - name: Checkout repo
      run: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check Readme
      run: |
        if [ -f "Readme.md" ]; then
          echo "File exist"
          if[ -s "Readme.md" ]; then
            echo "All checks passed"
            exit 0
          else
            echo "Checks dodesn't passed"
            exit 1
        else
          echo "file doesn't exist"
          exit 1      

    - name: Next step
      run: echo "Next step started"      